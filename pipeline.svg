<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#1a1a40"/>
      <stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="170" rx="18" fill="url(#bg)"/>

  <!-- animated flowing line -->
  <path d="M75 72 H825" stroke="#3a3a6a" stroke-width="3" fill="none"/>
  <path d="M75 72 H825" stroke="#00d4ff" stroke-width="3" fill="none" stroke-dasharray="10 12" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="44" to="0" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- travelling packet -->
  <circle r="7" fill="#ffffff" filter="url(#glow)">
    <animateMotion path="M75 72 H825" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- nodes -->
  <g filter="url(#glow)">
    <circle cx="75" cy="72" r="28" fill="#00d4ff"><animate attributeName="r" values="28;32;28" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="225" cy="72" r="28" fill="#7928ca"><animate attributeName="r" values="28;32;28" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="375" cy="72" r="28" fill="#00e676"><animate attributeName="r" values="28;32;28" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="525" cy="72" r="28" fill="#ff0080"><animate attributeName="r" values="28;32;28" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="675" cy="72" r="28" fill="#ff9900"><animate attributeName="r" values="28;32;28" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="825" cy="72" r="28" fill="#f46800"><animate attributeName="r" values="28;32;28" dur="2.4s" begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- icons -->
  <g font-size="26" text-anchor="middle">
    <text x="75" y="81">💻</text>
    <text x="225" y="81">⚙️</text>
    <text x="375" y="81">🧪</text>
    <text x="525" y="81">🏗️</text>
    <text x="675" y="81">☁️</text>
    <text x="825" y="81">📈</text>
  </g>

  <!-- labels -->
  <g font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="75" y="128">Code Push</text>
    <text x="225" y="128">GitHub Actions</text>
    <text x="375" y="128">Build &amp; Test</text>
    <text x="525" y="128">Terraform</text>
    <text x="675" y="128">AWS Deploy</text>
    <text x="825" y="128">Monitor</text>
  </g>
  <g font-size="12" fill="#9aa0d0" text-anchor="middle">
    <text x="75" y="148">git push</text>
    <text x="225" y="148">CI/CD workflow</text>
    <text x="375" y="148">validate</text>
    <text x="525" y="148">plan &amp; apply</text>
    <text x="675" y="148">EC2 / EKS</text>
    <text x="825" y="148">Prometheus + Grafana</text>
  </g>
</svg>
